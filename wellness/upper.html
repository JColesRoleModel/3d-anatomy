<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Tree of Life · Upper Body Innervation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Use the same font family as the rest of the app -->
  <!-- Shared stylesheet for consistent design -->
  <link rel="stylesheet" href="css/legs_style.css">
  <link rel="stylesheet" href="css/footer-nav.css">
  <link rel="stylesheet" href="css/completion-modal.css">
  <link rel="stylesheet" href="../hub/nav.css">
  <link rel="stylesheet" href="css/hub.css">
  <!-- Favicon for the site icon -->
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <!-- Installable app (PWA) -->
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b0a1f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tree of Life">
  <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</head>

<body>
  <div class="app-frame">
    <header id="hub-nav" data-section="practice" data-base="../"></header>

    <main class="app-main">
      <!-- SCREEN 1: ROUTINE PICKER -->
      <section id="screen-select" class="screen screen-active">
        <a class="back-btn" href="index.html"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Practice home</span></a>
        <h1 class="screen-title">Upper Body Innervation</h1>
        <!-- Tagline intentionally omitted per user instruction. -->

        <div id="upper-routine-list" class="routine-list">
          <!-- Routine cards will be inserted by upper_app.js -->
        </div>

        <button id="upper-btn-random" class="btn random-btn">
          <span class="random-icon">⇄</span>
          <span>Random Routine</span>
        </button>
      </section>

      <!-- SCREEN 2: PREFERENCES -->
      <section id="screen-prefs" class="screen prefs-screen">
        <button type="button" class="back-btn" data-back="screen-select"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>All routines</span></button>
        <h1 id="prefs-title" class="screen-title">Routine</h1>
        <p id="prefs-tagline" class="screen-tagline">Set your timing and rounds.</p>
        <button id="btn-start-routine" class="btn primary-btn full-width">Start Routine</button>

        <div class="routine-preview-card">
          <div class="preview-label" id="prefs-preview-label"></div>
          <div class="preview-strip" id="prefs-preview-strip">
            <!-- Thumbnails populated by JS -->
          </div>
        </div>

        <div class="prefs-grid">
          <div class="field">
            <label for="input-seconds">Seconds per movement</label>
            <input id="input-seconds" type="number" min="5" max="300" step="5" value="45">
          </div>
          <div class="field">
            <label for="input-rest">Time between movements (sec)</label>
            <!-- Default rest is 3 seconds -->
            <input id="input-rest" type="number" min="0" max="120" step="1" value="3">
          </div>
          <div class="field">
            <label for="input-rounds">Rounds of routine</label>
            <input id="input-rounds" type="number" min="1" max="12" step="1" value="2">
          </div>
          <div class="field">
            <label>Audio</label>
            <button id="upper-audio-toggle" class="pill-toggle" data-on="1">
              <span class="pill-knob"></span>
              <span class="pill-label">On</span>
            </button>
          </div>
        </div>
      </section>

      <!-- SCREEN 3: ROUTINE PLAYER -->
      <section id="screen-player" class="screen player-screen">
        <div class="screen-top">
          <button type="button" class="back-btn" data-back="screen-prefs"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Settings</span></button>
          <h1 id="player-title" class="screen-title">Routine</h1>
        </div>
        <p id="player-tagline" class="screen-tagline">Follow the movements at your own pace.</p>

        <!-- Controls first, so the timer and buttons are always in view above the picture -->
        <div class="player-dock">
          <div class="movement-meta player-status">
            <div id="movement-count" class="movement-count">Movement 1 of 1</div>
            <div id="round-count" class="round-count">Round 1 of 1</div>
            <div id="phase-label" class="phase-label">Ready</div>
          </div>
          <div class="progress-area">
            <div class="progress-wrap">
              <div id="prog" class="progress-fill"></div>
            </div>
          </div>
          <div class="player-controls">
            <button id="btn-play-pause" class="btn primary-btn">Start</button>
            <button id="btn-stop" class="btn ghost-btn" title="Stop and keep the time done so far">Stop</button>
            <button id="btn-restart" class="btn ghost-btn" title="Restart Routine">Restart</button>
          </div>
          <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
        </div>

        <div class="current-movement-card">
          <div id="current-movement-label" class="movement-label">Movement</div>
          <div class="movement-image-frame">
            <img id="current-movement-image" alt="Current movement">
          </div>
        </div>

        <div class="routine-preview-card">
          <div class="preview-label" id="player-preview-label"></div>
          <div class="preview-strip" id="player-preview-strip">
            <!-- Thumbnails populated by JS -->
          </div>
        </div>
      </section>
    </main>

    <nav class="hub-bar" aria-label="Sections">
      <a class="chip chip-anatomy" href="../" title="Back to the 3D anatomy"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="4.6" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 9.2h14M12 9.2v6.3M12 15.5l-3.2 5.6M12 15.5l3.2 5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>3D Anatomy</a>
      <a class="chip" href="index.html" style="--c:#e6bd6a"><span class="dot"></span>Home</a>
      <a class="chip" href="eyes.html" style="--c:#7fd3ff"><span class="dot"></span>Eyes</a>
      <a class="chip" href="breathwork.html" style="--c:#9fe3c0"><span class="dot"></span>Breath</a>
      <a class="chip" href="mudras.html" style="--c:#ffb36b"><span class="dot"></span>Mudras</a>
      <a class="chip" href="lower.html" style="--c:#a77bff"><span class="dot"></span>Lower body</a>
      <a class="chip" href="upper.html" style="--c:#ff8fa8" aria-current="page"><span class="dot"></span>Upper body</a>
      <a class="chip" href="head.html" style="--c:#d9b8ff"><span class="dot"></span>Head</a>
      <a class="chip" href="random.html" style="--c:#f6e3b4"><span class="dot"></span>Random</a>
    </nav>
  </div>

  <audio id="audio-beep" preload="auto"></audio>
  <audio id="audio-ding" src="assets/audio/ding.mp3" preload="auto"></audio>

  <script src="js/time-tracker.js"></script>
  <script src="js/screen-history.js" defer></script>
  <script type="module">
    import { initHub } from '../hub/nav.js';
    initHub({ tools: [
      { id: 'footer-stats', icon: 'stats', label: 'Practice stats' },
      { id: 'hub-about', icon: 'info', label: 'About & contact', href: 'other.html' },
    ] });
  </script>


  <script type="module" src="js/cloud-sync.js"></script>
  <script src="js/time-stats-ui.js"></script>
  <script src="js/lazy-loader.js"></script>
  <script src="js/phase-bar.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/menu.js"></script>
  <!-- Include the upper body logic script -->
  <script src="js/upper_app.js" defer></script>
  <script src="js/completion-prompt.js"></script>
</body>

</html>
