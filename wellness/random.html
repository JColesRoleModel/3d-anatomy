<body>
    <div class="app-frame">
        <header id="hub-nav" data-section="practice" data-base="../"></header>
        <main class="app-main">
            <section class="screen screen-active">
                <h1 class="screen-title">🔀 Random Routine</h1>
                <p class="screen-tagline">Let fate choose your practice - every routine is an adventure</p>

                <div class="random-grid">
                    <button class="random-card" data-type="all">
                        <span class="random-icon">🌟</span>
                        <span class="random-label">Random of ALL</span>
                    </button>

                    <button class="random-card" data-type="eyes">
                        <span class="random-icon">👁️</span>
                        <span class="random-label">Random Eye Routine</span>
                    </button>

                    <button class="random-card" data-type="breath">
                        <span class="random-icon">🫁</span>
                        <span class="random-label">Random Breath Pattern</span>
                    </button>

                    <button class="random-card" data-type="lower">
                        <span class="random-icon">🦵</span>
                        <span class="random-label">Random Lower Body</span>
                    </button>

                    <button class="random-card" data-type="upper">
                        <span class="random-icon">💪</span>
                        <span class="random-label">Random Upper Body</span>
                    </button>

                    <button class="random-card" data-type="head">
                        <span class="random-icon">🧠</span>
                        <span class="random-label">Random Head</span>
                    </button>

                    <button class="random-card" data-type="mudra">
                        <span class="random-icon">🤲</span>
                        <span class="random-label">Random Mudra</span>
                    </button>
                </div>

                <div class="back-link">
                    <a href="index.html">← Back to Home</a>
                </div>
            </section>
        </main>

        <nav class="hub-bar" aria-label="Sections">
      <a class="chip chip-anatomy" href="../" title="Back to the 3D anatomy"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="4.6" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 9.2h14M12 9.2v6.3M12 15.5l-3.2 5.6M12 15.5l3.2 5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>3D Anatomy</a>
      <a class="chip" href="index.html" style="--c:#e6bd6a"><span class="dot"></span>Home</a>
      <a class="chip" href="eyes.html" style="--c:#7fd3ff"><span class="dot"></span>Eyes</a>
      <a class="chip" href="breathwork.html" style="--c:#9fe3c0"><span class="dot"></span>Breath</a>
      <a class="chip" href="mudras.html" style="--c:#ffb36b"><span class="dot"></span>Mudras</a>
      <a class="chip" href="lower.html" style="--c:#a77bff"><span class="dot"></span>Lower body</a>
      <a class="chip" href="upper.html" style="--c:#ff8fa8"><span class="dot"></span>Upper body</a>
      <a class="chip" href="head.html" style="--c:#d9b8ff"><span class="dot"></span>Head</a>
      <a class="chip" href="random.html" style="--c:#f6e3b4" aria-current="page"><span class="dot"></span>Random</a>
    </nav>
    </div>

    <script>
        // Random routine selections
        const routines = {
            all: [
                'eyes.html?routine=FULL',
                'eyes.html?routine=GROUND',
                'eyes.html?routine=RESTORE',
                'eyes.html?routine=ALERT',
                'lower.html?routine=HIPS1',
                'lower.html?routine=HIPS2',
                'upper.html?routine=RANDOM',
                'head.html?routine=RANDOM',
                'mudras.html',
                'breathwork.html'
            ],
            eyes: [
                'eyes.html?routine=FULL',
                'eyes.html?routine=GROUND',
                'eyes.html?routine=RESTORE',
                'eyes.html?routine=ALERT'
            ],
            breath: ['breathwork.html'],
            lower: [
                'lower.html?routine=HIPS1',
                'lower.html?routine=HIPS2'
            ],
            upper: ['upper.html?routine=RANDOM'],
            head: ['head.html?routine=RANDOM'],
            mudra: ['mudras.html']
        };

        // Handle card clicks
        document.querySelectorAll('.random-card').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.add('clicked');
                const type = card.dataset.type;
                const options = routines[type];
                const random = options[Math.floor(Math.random() * options.length)];

                setTimeout(() => {
                    window.location.href = random;
                }, 300);
            });
        });
    </script>
    <script src="js/time-tracker.js"></script>
  <script type="module">
    import { initHub } from '../hub/nav.js';
    initHub({ tools: [
      { id: 'footer-stats', icon: 'stats', label: 'Practice stats' },
      { id: 'hub-about', icon: 'info', label: 'About & contact', href: 'other.html' },
    ] });
  </script>

    <script type="module" src="js/cloud-sync.js"></script>
    <script src="js/time-stats-ui.js"></script>
    <script src="js/sky.js"></script>

</body>
