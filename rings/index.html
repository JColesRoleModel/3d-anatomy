<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rings - Tree of Life NRI</title>
  <link rel="stylesheet" href="../hub/nav.css">
  <link rel="stylesheet" href="../hub/page.css">
  <link rel="stylesheet" href="rings.css">
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b0a1f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tree of Life">
  <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <header id="hub-nav" data-section="rings" data-base="../"></header>

  <main class="t-main">
    <section class="t-gate" id="gate">
      <h1 class="t-title">Rings</h1>
      <p class="t-lede" id="gate-text">Opening your rings…</p>
      <button class="t-btn t-primary hidden" id="gate-signin" type="button">Sign in</button>
    </section>

    <section class="hidden r-app" id="app">
      <!-- Today -->
      <div class="r-row r-row-top">
        <div class="t-panel r-today">
          <div class="r-big" id="big"></div>
          <div class="r-legend" id="legend"></div>
          <button class="t-btn t-primary r-log-btn" id="log-open" type="button">＋ Log time</button>
        </div>
        <section class="t-panel r-streaks">
          <h2 class="r-h2">Streaks</h2>
          <div class="r-streak-list" id="streaks"></div>
        </section>
      </div>

      <!-- Any stretch of time -->
      <section class="t-panel r-range-panel" id="history">
        <div class="r-range-head">
          <div class="t-seg r-range-tabs" id="range-tabs" role="tablist">
            <button type="button" class="t-seg-btn" data-range="week">Week</button>
            <button type="button" class="t-seg-btn" data-range="month">Month</button>
            <button type="button" class="t-seg-btn" data-range="all">All time</button>
            <button type="button" class="t-seg-btn" data-range="custom">Dates</button>
          </div>
          <div class="r-range-nav" id="range-nav">
            <button class="t-btn t-icon" id="prev" type="button" aria-label="Earlier">‹</button>
            <b id="range-label"></b>
            <button class="t-btn t-icon" id="next" type="button" aria-label="Later">›</button>
          </div>
          <div class="r-range-dates hidden" id="range-dates">
            <label>From <input class="t-input" type="date" id="from"></label>
            <label>To <input class="t-input" type="date" id="to"></label>
          </div>
        </div>

        <div class="r-totals" id="totals"></div>
        <div class="r-chart" id="chart"></div>

        <h2 class="r-h2" id="practice">Where the time went</h2>
        <div class="r-breakdown" id="breakdown"></div>

        <h2 class="r-h2">Every session</h2>
        <p class="r-note">Tap a practice session to see each movement and its time.</p>
        <div class="r-days-log" id="log"></div>
      </section>

      <section class="t-panel">
        <h2 class="r-h2">Last 12 weeks</h2>
        <div class="r-heat" id="heat"></div>
        <p class="r-heat-key">Each square is a day: brighter means more rings closed.</p>
      </section>

      <section class="t-panel">
        <h2 class="r-h2">Daily goals</h2>
        <form class="r-goals" id="goals" autocomplete="off"></form>
      </section>
    </section>
  </main>

  <!-- Log time by hand: anything done away from the site -->
  <div class="t-modal hidden" id="logtime">
    <div class="t-modal-back" data-close></div>
    <form class="t-modal-card" id="log-form" role="dialog" aria-modal="true" aria-labelledby="log-title" autocomplete="off">
      <div class="t-modal-head">
        <h2 id="log-title">Log time</h2>
        <button class="t-btn t-icon" type="button" data-close aria-label="Close">✕</button>
      </div>
      <label class="t-field"><span>What did you do?</span><input class="t-input" id="log-what" maxlength="200" placeholder="Walk outside, yoga class, reading…" required></label>
      <div class="r-pick-label">Ring</div>
      <div class="t-seg r-ring-pick" id="log-ring" role="radiogroup" aria-label="Ring"></div>
      <div class="r-log-times">
        <label class="t-field"><span>Date</span><input class="t-input" type="date" id="log-date" required></label>
        <label class="t-field"><span>Start</span><input class="t-input" type="time" id="log-start" required></label>
        <label class="t-field"><span>End</span><input class="t-input" type="time" id="log-end" required></label>
      </div>
      <p class="r-log-length" id="log-length"></p>
      <label class="t-field"><span>Tags (optional, separated by commas)</span><input class="t-input" id="log-tags" maxlength="200" placeholder="walk, outside, morning"></label>
      <label class="t-field"><span>Notes (optional)</span><textarea class="t-input t-textarea" id="log-notes" maxlength="1000"></textarea></label>
      <p class="t-hint" id="log-hint" role="alert"></p>
      <div class="t-modal-foot">
        <button class="t-btn r-del hidden" id="log-delete" type="button">Delete</button>
        <button class="t-btn" type="button" data-close>Cancel</button>
        <button class="t-btn t-primary" type="submit" id="log-save">Save</button>
      </div>
    </form>
  </div>

  <div class="t-toast hidden" id="toast" role="status" aria-live="polite"></div>
  <script type="module">
    import { initHub } from '../hub/nav.js';
    initHub({ tools: [{ id: 'r-log', label: 'Log time', icon: 'plus' }] });
  </script>
  <script type="module" src="rings.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});</script>
</body>
</html>
