<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tree of Life: Neurological Research Institute</title>
  <meta name="description" content="Explore the body in 3D, practice, watch, scroll, keep tasks, and track your Body, Mind and Spirit rings.">
  <link rel="stylesheet" href="../hub/nav.css">
  <link rel="stylesheet" href="../hub/page.css">
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <link rel="manifest" href="../manifest.webmanifest?v=2">
  <meta name="theme-color" content="#0b0a1f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tree of Life">
  <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
  <style>
    .home { max-width: 980px; margin: 0 auto; padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
    .home-hero { text-align: center; margin: 4vh 0 26px; }
    .home-hero img { width: 92px; height: auto; filter: drop-shadow(0 0 14px rgba(230, 189, 106, 0.5)); }
    .home-hero h1 { margin: 10px 0 4px; font: 700 clamp(34px, 6vw, 52px)/1 var(--serif); color: var(--cream); text-shadow: 0 0 20px rgba(230, 189, 106, 0.35); }
    .home-hero p { margin: 0; color: var(--muted); }
    .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .home-tile {
      display: flex; flex-direction: column; gap: 8px; padding: 18px; min-height: 132px; border-radius: 20px; text-decoration: none; color: var(--text);
      border: 1px solid var(--line); background: var(--panel); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); box-shadow: var(--glow);
      transition: border-color 0.2s, transform 0.2s;
    }
    .home-tile:hover { border-color: rgba(230, 189, 106, 0.6); transform: translateY(-2px); }
    .home-tile svg { color: var(--gold); }
    .home-tile b { font: 700 24px/1 var(--serif); color: var(--cream); }
    .home-tile span { font-size: 14px; color: var(--muted); line-height: 1.35; }
    .home-tile.big { grid-column: span 2; }
    @media (max-width: 520px) { .home-grid { grid-template-columns: 1fr 1fr; } .home-tile { min-height: 116px; padding: 14px; } .home-tile b { font-size: 20px; } .home-tile span { font-size: 12.5px; } .home-tile.big { grid-column: span 2; } }
    .home { padding-top: 6px; }
    .home-h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .home-go { margin: 22px 4px 10px; font: 700 22px/1 var(--serif); color: var(--cream); }
    .today { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .td-card { padding: 16px 18px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); box-shadow: var(--glow); min-width: 0; }
    .td-card a { color: var(--cream); }
    .td-title { font: 700 22px/1.1 var(--serif); color: var(--cream); margin-bottom: 8px; }
    .td-title a { text-decoration: none; }
    .td-title small { font: 13px/1 var(--sans); color: var(--muted); margin-left: 6px; }
    .td-muted { margin: 0; color: var(--muted); font-size: 14px; }
    .td-rings { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; }
    .td-svg { flex: none; display: block; }
    .td-ring-list { flex: 1; min-width: 0; }
    .td-ring { display: grid; grid-template-columns: 12px 64px 1fr auto; align-items: baseline; gap: 8px; padding: 3px 0; font-size: 15px; }
    .td-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); display: inline-block; }
    .td-time { font-variant-numeric: tabular-nums; }
    .td-time small { color: var(--muted); }
    .td-left { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
    .td-streak { margin-top: 6px; font-size: 13px; color: var(--gold); }
    .td-next { grid-column: 1 / -1; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; border-color: color-mix(in srgb, var(--c, #e6bd6a) 45%, transparent); }
    .td-next-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); }
    .td-next-text { color: var(--text); }
    .td-scores { display: grid; gap: 4px; }
    .td-score { display: grid; grid-template-columns: 1fr auto 18px; gap: 8px; font-size: 14px; color: var(--muted); }
    .td-score b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .td-trend { text-align: center; }
    .td-trend.better, .td-move.better { color: var(--emerald); }
    .td-trend.worse, .td-move.worse { color: var(--red); }
    .td-key { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
    .td-task { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); text-decoration: none; font-size: 14px; }
    .td-task:first-of-type { border-top: 0; }
    .td-task span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .td-task small { flex: none; color: var(--muted); }
    .td-task.late small { color: var(--red); }
    .td-week { grid-column: 1 / -1; }
    .td-week-tot { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 6px; font-size: 14px; }
    .td-week-tot .td-dot { margin-right: 6px; }
    .td-moves { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 13px; color: var(--muted); }
    @media (max-width: 620px) {
      .today { grid-template-columns: 1fr; }
      .td-rings { flex-direction: column; align-items: stretch; gap: 10px; }
      .td-svg { align-self: center; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <header id="hub-nav" data-section="home" data-base="../"></header>
  <main class="home">
    <h1 class="home-h1">Today</h1>
    <div id="today" class="today" hidden></div>
    <h2 class="home-go">Go to</h2>
    <nav class="home-grid" id="tiles" aria-label="Sections"></nav>
  </main>
  <script type="module">
    import { initHub, icon } from '../hub/nav.js';
    initHub();
    // Links are from this page (home/) to its sibling folders, hence ../
    const TILES = [
      ['../rings/', 'rings', 'Rings', 'Body, Mind and Spirit today, your streaks and every session.', true],
      ['../checkin/', 'pulse', 'Check-in', 'How you feel, mental math, reaction time, breath hold and more, tracked over time.'],
      ['../watch/', 'play', 'Watch', 'Your library of videos and audiobooks, timed to the second.'],
      ['../wellness/', 'lotus', 'Practice', 'Innervation, breathwork, neuro-ocular and mudras.'],
      ['../scroll/', 'scroll', 'Scroll', 'A positive doomscroll of the cards you chose.'],
      ['../tasks/', 'check', 'Tasks', 'Due dates and general to-dos, on every device.'],
      ['../dashboard/', 'screen', 'Dashboard', 'A light screen to leave on: clock, rings, today.'],
      ['../?view=3d', 'body', '3D Anatomy', 'The body in 3D, layer by layer. Needs a recent device.'],
    ];
    document.getElementById('tiles').innerHTML = TILES.map(([href, ic, label, text, big]) =>
      `<a class="home-tile${big ? ' big' : ''}" href="${href}">${icon(ic, 26)}<b>${label}</b><span>${text}</span></a>`).join('');
  </script>
  <script type="module" src="today.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});</script>
</body>
</html>
